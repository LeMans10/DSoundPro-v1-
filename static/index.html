<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#09090b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="DSoundPro" />
  <title>DSoundPro — Tu Música Sin Límites</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" href="/static/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/styles.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <!-- Dynamic ambient glow tied to current track cover -->
    <div id="ambient-bg" class="ambient-bg"></div>

    <!-- LEFT SIDEBAR (Desktop) -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <div class="brand" id="brand-home" role="button" tabindex="0">
          <div class="brand-logo">
            <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="18" cy="18" r="18" fill="url(#dspGrad)"/>
              <path d="M10.5 14.5C15.2 12.6 21.3 12.9 25.8 15.6" stroke="#08080a" stroke-width="2.6" stroke-linecap="round"/>
              <path d="M12 19.2C15.9 17.7 20.8 18 24.4 20.2" stroke="#08080a" stroke-width="2.3" stroke-linecap="round"/>
              <path d="M13.6 23.6C16.7 22.4 20.3 22.7 23 24.4" stroke="#08080a" stroke-width="2" stroke-linecap="round"/>
              <defs>
                <linearGradient id="dspGrad" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#22f06b"/>
                  <stop offset="1" stop-color="#14a84c"/>
                </linearGradient>
              </defs>
            </svg>
          </div>
          <div class="brand-text">
            <span class="brand-name">DSound<span class="accent">Pro</span></span>
            <span class="brand-tag">HI-FI &amp; OFFLINE</span>
          </div>
        </div>

        <nav class="main-nav">
          <button class="nav-item active" data-view="home">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.71 2.29a1 1 0 0 0-1.42 0l-9 9a1 1 0 0 0 .71 1.71H5v8a1 1 0 0 0 1 1h4a1 1 0 0 0 1-1v-5h2v5a1 1 0 0 0 1 1h4a1 1 0 0 0 1-1v-8h2a1 1 0 0 0 .71-1.71z"/></svg>
            <span>Inicio</span>
          </button>
          <button class="nav-item" data-view="search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7.5"/><path d="M20 20l-4.2-4.2" stroke-linecap="round"/></svg>
            <span>Buscar</span>
          </button>
          <button class="nav-item" data-view="library">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"><path d="M4 6v14M9 4v16M14 6l5 14" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>Tu Biblioteca</span>
          </button>
          <button class="nav-item" data-view="downloads">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 3v12m0 0l-4.5-4.5M12 15l4.5-4.5M4 19h16" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>Descargas MP3</span>
            <span class="nav-badge" id="nav-dl-badge" hidden>0</span>
          </button>
        </nav>
      </div>

      <div class="sidebar-library">
        <div class="sidebar-section-header">
          <span>TUS PLAYLISTS</span>
          <button class="icon-btn-sm" id="btn-new-playlist-side" title="Crear Playlist">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>
          </button>
        </div>

        <button class="playlist-mini-item" data-view="liked">
          <div class="playlist-mini-art liked-art">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54z"/></svg>
          </div>
          <div class="playlist-mini-meta">
            <span class="playlist-mini-title">Tus Me Gusta</span>
            <span class="playlist-mini-sub" id="sidebar-likes-count">0 canciones</span>
          </div>
        </button>

        <div id="sidebar-playlists" class="sidebar-playlists-list"></div>
      </div>

      <div class="sidebar-footer">
        <button class="connect-phone-btn" id="btn-open-qr">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="2" width="12" height="20" rx="2.5"/><circle cx="12" cy="18" r="1" fill="currentColor"/></svg>
          <span>Conectar Celular (QR)</span>
        </button>
      </div>
    </aside>

    <!-- MAIN VIEWPORT -->
    <div class="main-column">
      <!-- Sticky Top Bar -->
      <header class="topbar">
        <div class="topbar-left">
          <div class="mobile-brand">
            <div class="brand-logo-sm">
              <svg viewBox="0 0 36 36" fill="none"><circle cx="18" cy="18" r="18" fill="#1ed760"/><path d="M10.5 14.5C15.2 12.6 21.3 12.9 25.8 15.6M12 19.2C15.9 17.7 20.8 18 24.4 20.2M13.6 23.6C16.7 22.4 20.3 22.7 23 24.4" stroke="#08080a" stroke-width="2.4" stroke-linecap="round"/></svg>
            </div>
            <span>DSound<strong class="accent">Pro</strong></span>
          </div>

          <div class="history-btns">
            <button class="circle-btn" id="btn-nav-back" title="Atrás">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>

          <div class="topbar-search-wrap" id="topbar-search-wrap">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7.5"/><path d="M20 20l-4.2-4.2" stroke-linecap="round"/></svg>
            <input type="text" id="global-search-input" placeholder="¿Qué quieres escuchar o descargar hoy?" autocomplete="off" />
            <button class="search-clear-btn" id="btn-clear-search" hidden>&times;</button>
          </div>
        </div>

        <div class="topbar-right">
          <button class="pill-btn ghost-pill" id="btn-import-top" title="Importar MP3/M4A/WAV locales">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"><path d="M12 15V3m0 0L7.5 7.5M12 3l4.5 4.5M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="hide-sm">Importar</span>
          </button>
          <button class="pill-btn accent-pill mobile-qr-trigger" id="btn-open-qr-top" title="Conectar celular o instalar App">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM18 18h3v3h-3zM18 14h3M14 18v3" stroke-linecap="round"/></svg>
            <span class="hide-sm">Celular</span>
          </button>
        </div>
      </header>

      <!-- Main Dynamic Content Container -->
      <main class="main-content" id="main-content">
        <div class="loading-splash">
          <div class="spinner"></div>
          <p>Cargando tu universo musical...</p>
        </div>
      </main>
    </div>

    <!-- RIGHT COLLAPSIBLE PANEL (Queue / Lyrics / EQ Studio) -->
    <aside class="right-panel" id="right-panel">
      <div class="right-panel-tabs">
        <button class="rp-tab active" data-rp="queue">Cola</button>
        <button class="rp-tab" data-rp="lyrics">Letra</button>
        <button class="rp-tab" data-rp="studio">EQ &amp; Audio</button>
        <button class="icon-btn-sm rp-close" id="btn-close-rp" title="Cerrar panel">&times;</button>
      </div>
      <div class="right-panel-body" id="right-panel-body"></div>
    </aside>

    <!-- DESKTOP PLAYER BAR -->
    <footer class="player-bar" id="player-bar">
      <!-- Left: Current Track -->
      <div class="player-left">
        <div class="player-cover-wrap" id="btn-open-fullscreen">
          <img id="player-cover" src="/static/icons/icon-192.png" alt="Portada" />
          <div class="cover-expand-hint">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7" stroke-linecap="round"/></svg>
          </div>
        </div>
        <div class="player-meta">
          <div class="player-title" id="player-title">Selecciona una canción</div>
          <div class="player-artist" id="player-artist">DSoundPro Hi-Fi</div>
        </div>
        <button class="icon-btn" id="btn-player-like" title="Me gusta">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54z"/></svg>
        </button>
        <button class="icon-btn" id="btn-player-download" title="Descargar MP3 para otros reproductores">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 3v12m0 0l-4.5-4.5M12 15l4.5-4.5M4 19h16" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>

      <!-- Center: Transport & Seek -->
      <div class="player-center">
        <div class="player-controls">
          <button class="icon-btn" id="btn-shuffle" title="Aleatorio (S)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="icon-btn" id="btn-prev" title="Anterior">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
          </button>
          <button class="play-circle-btn" id="btn-play-pause" title="Reproducir / Pausar (Espacio)">
            <svg id="icon-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.14v14l11-7-11-7z"/></svg>
            <svg id="icon-pause" viewBox="0 0 24 24" fill="currentColor" hidden><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
            <div id="icon-buffering" class="mini-spinner" hidden></div>
          </button>
          <button class="icon-btn" id="btn-next" title="Siguiente">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zm-10 0l8.5 6L6 18z"/></svg>
          </button>
          <button class="icon-btn" id="btn-repeat" title="Repetir (R)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"><path d="M17 2l4 4-4 4M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v1a4 4 0 0 1-4 4H3" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="repeat-one-dot" id="repeat-one-badge" hidden>1</span>
          </button>
        </div>

        <div class="progress-row">
          <span class="time-label" id="time-current">0:00</span>
          <div class="slider-wrap" id="seek-wrap">
            <input type="range" id="seek-slider" min="0" max="100" value="0" step="0.1" />
          </div>
          <span class="time-label" id="time-duration">0:00</span>
        </div>
      </div>

      <!-- Right: Lyrics, Queue, EQ, Volume -->
      <div class="player-right">
        <button class="icon-btn" id="btn-toggle-lyrics" title="Letra sincronizada (L)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3M8 22h8" stroke-linecap="round"/></svg>
        </button>
        <button class="icon-btn" id="btn-toggle-queue" title="Cola de reproducción">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"><path d="M4 6h16M4 12h10M4 18h10M18 12v7m0 0l2.5-2.5M18 19l-2.5-2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="icon-btn" id="btn-toggle-studio" title="Ecualizador, Visualizador y Temporizador">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6" stroke-linecap="round"/></svg>
        </button>
        <div class="volume-control">
          <button class="icon-btn" id="btn-mute" title="Silenciar (M)">
            <svg id="vol-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"><path d="M11 5L6 9H2v6h4l5 4V5zM15.54 8.46a5 5 0 0 1 0 7.07M19.07 4.93a10 10 0 0 1 0 14.14" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="slider-wrap volume-slider-wrap">
            <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.85" />
          </div>
        </div>
      </div>
    </footer>

    <!-- MOBILE FLOATING MINI-PLAYER -->
    <div class="mobile-mini-player" id="mobile-mini-player" hidden>
      <div class="mini-player-main" id="mobile-mini-open">
        <img id="mini-cover" src="/static/icons/icon-192.png" alt="Cover" />
        <div class="mini-meta">
          <div class="mini-title" id="mini-title">Selecciona una canción</div>
          <div class="mini-artist" id="mini-artist">DSoundPro</div>
        </div>
      </div>
      <div class="mini-actions">
        <button class="icon-btn" id="btn-mini-like" title="Me gusta">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54z"/></svg>
        </button>
        <button class="icon-btn mini-play-btn" id="btn-mini-play" title="Reproducir / Pausar">
          <svg id="mini-icon-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.14v14l11-7-11-7z"/></svg>
          <svg id="mini-icon-pause" viewBox="0 0 24 24" fill="currentColor" hidden><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
        </button>
      </div>
      <div class="mini-progress-track">
        <div class="mini-progress-fill" id="mini-progress-fill"></div>
      </div>
    </div>

    <!-- MOBILE BOTTOM TAB NAVIGATION -->
    <nav class="mobile-bottom-nav" id="mobile-bottom-nav">
      <button class="mnav-item active" data-view="home">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.71 2.29a1 1 0 0 0-1.42 0l-9 9a1 1 0 0 0 .71 1.71H5v8a1 1 0 0 0 1 1h4a1 1 0 0 0 1-1v-5h2v5a1 1 0 0 0 1 1h4a1 1 0 0 0 1-1v-8h2a1 1 0 0 0 .71-1.71z"/></svg>
        <span>Inicio</span>
      </button>
      <button class="mnav-item" data-view="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7.5"/><path d="M20 20l-4.2-4.2" stroke-linecap="round"/></svg>
        <span>Buscar</span>
      </button>
      <button class="mnav-item" data-view="library">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"><path d="M4 6v14M9 4v16M14 6l5 14" stroke-linecap="round"/></svg>
        <span>Biblioteca</span>
      </button>
      <button class="mnav-item" data-view="downloads">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 3v12m0 0l-4.5-4.5M12 15l4.5-4.5M4 19h16" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Descargas</span>
      </button>
    </nav>
  </div>

  <!-- FULLSCREEN NOW PLAYING SHEET (Mobile & Desktop Cinema Mode) -->
  <div class="fullscreen-player" id="fullscreen-player" aria-hidden="true">
    <div class="fs-backdrop" id="fs-backdrop"></div>
    <div class="fs-inner">
      <div class="fs-header">
        <button class="icon-btn" id="btn-close-fs" title="Minimizar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 9l6 6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="fs-header-info">
          <span class="fs-kicker">REPRODUCIENDO DESDE DSOUNDPRO</span>
          <span class="fs-album" id="fs-album">—</span>
        </div>
        <button class="icon-btn" id="btn-fs-menu" title="Opciones">
          <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
        </button>
      </div>

      <div class="fs-mode-switch">
        <button class="fs-mode-btn active" data-fsmode="player">Portada</button>
        <button class="fs-mode-btn" data-fsmode="lyrics">Letra</button>
        <button class="fs-mode-btn" data-fsmode="queue">Cola</button>
        <button class="fs-mode-btn" data-fsmode="eq">Ecualizador</button>
      </div>

      <div class="fs-stage" id="fs-stage-player">
        <div class="fs-art-wrap">
          <img id="fs-cover" src="/static/icons/icon-192.png" alt="Cover" />
          <canvas id="fs-visualizer" class="fs-visualizer"></canvas>
        </div>

        <div class="fs-track-row">
          <div class="fs-track-meta">
            <h2 id="fs-title">Selecciona una canción</h2>
            <p id="fs-artist">DSoundPro</p>
          </div>
          <div class="fs-track-quick">
            <button class="icon-btn" id="btn-fs-like" title="Me gusta">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54z"/></svg>
            </button>
            <button class="icon-btn" id="btn-fs-download" title="Descargar MP3">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 3v12m0 0l-4.5-4.5M12 15l4.5-4.5M4 19h16" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </div>

        <div class="fs-seek-area">
          <div class="slider-wrap">
            <input type="range" id="fs-seek-slider" min="0" max="100" value="0" step="0.1" />
          </div>
          <div class="fs-times">
            <span id="fs-time-current">0:00</span>
            <span id="fs-time-duration">0:00</span>
          </div>
        </div>

        <div class="fs-controls">
          <button class="icon-btn" id="btn-fs-shuffle" title="Aleatorio">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="icon-btn fs-skip" id="btn-fs-prev" title="Anterior">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
          </button>
          <button class="fs-play-btn" id="btn-fs-play" title="Reproducir / Pausar">
            <svg id="fs-icon-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.14v14l11-7-11-7z"/></svg>
            <svg id="fs-icon-pause" viewBox="0 0 24 24" fill="currentColor" hidden><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
          </button>
          <button class="icon-btn fs-skip" id="btn-fs-next" title="Siguiente">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zm-10 0l8.5 6L6 18z"/></svg>
          </button>
          <button class="icon-btn" id="btn-fs-repeat" title="Repetir">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"><path d="M17 2l4 4-4 4M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v1a4 4 0 0 1-4 4H3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>

      <div class="fs-stage fs-substage" id="fs-stage-extra" hidden></div>
    </div>
  </div>

  <!-- MODALS -->
  <div class="modal-overlay" id="modal-overlay" hidden>
    <div class="modal-card" id="modal-card"></div>
  </div>

  <!-- CONTEXT MENU -->
  <div class="context-menu" id="context-menu" hidden></div>

  <!-- TOAST NOTIFICATIONS -->
  <div class="toast-container" id="toast-container"></div>

  <!-- HIDDEN FILE INPUT FOR LOCAL AUDIO IMPORT -->
  <input type="file" id="local-file-input" accept=".mp3,.m4a,.wav,.flac,.ogg,.opus,.aac,audio/*" multiple hidden />

  <script src="/static/js/api.js"></script>
